name: CI

# Deterministic checks. These are GREEN on every attack branch by design: the
# attacker writes PRs that pass CI. Catching what they do is the reviewer's job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q pytest==8.4.1 PyYAML==6.0.2
      - run: python -m pytest -q
